{% set version = "2.2.3" %}

package:
  name: grads
  version: {{ version }}

source:
  path: ..

build:
  number: 5

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - make
    - autoconf
    - automake
    - libtool
    - pkg-config
    - xorg-xproto
  host:
    - python
    - xorg-xproto
    - libxcb
    - xorg-libx11
    - freetype
    - libnetcdf ==4.10
    - hdf5
    - hdf4
    - udunits2
    - g2clib ==2.3.0
    - geotiff
    - libtiff
    - cairo
    - readline
    - ncurses
    - libpng
    - zlib
    - libjpeg-turbo
    - jasper
    - libgd
    - libxml2
    - curl
    - shapelib
  run:
    - libnetcdf ==4.10
    - hdf5
    - udunits2
    - g2clib ==2.3.0
    - geotiff
    - libtiff
    - jasper
    - cairo
    - readline
    - libpng
    - ncurses
    - libgd
    - shapelib

about:
  home: http://cola.gmu.edu/grads/
  license: GPL-2.0
  summary: Grid Analysis and Display System (GrADS)

outputs:
  - name: gradspy
    build:
      noarch: python
    files:
      - lib/python*/site-packages/gradspy.py
      - lib/python*/site-packages/__pycache__/gradspy.cpython-*.pyc
    requirements:
      run:
        - python >=3.8
        - numpy >=2.0
        - pandas
        - xarray
        - grads =={{ version }}
    about:
      home: http://cola.gmu.edu/grads/
      license: GPL-2.0
      summary: Python interface to GrADS (Grid Analysis and Display System)
