package:
  name: grads
  version: 2.2.3

source:
  path: ..

build:
  number: 5

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - make
    - autoconf
    - automake
    - libtool
    - pkg-config
    - xorg-xproto
  host:
    - xorg-xproto
    - libxcb
    - xorg-libx11
    - freetype
    - libnetcdf
    - hdf5
    - hdf4
    - udunits2
    - g2clib ==2.3.0
    - geotiff
    - libtiff
    - cairo
    - readline
    - ncurses
    - libpng
    - zlib
    - libjpeg-turbo
    - jasper
    - libgd
    - libxml2
    - curl
    - shapelib
  run:
    - libnetcdf
    - hdf5
    - udunits2
    - g2clib ==2.3.0
    - geotiff
    - libtiff
    - jasper
    - cairo
    - readline
    - libpng
    - ncurses
    - libgd
    - shapelib

about:
  home: http://cola.gmu.edu/grads/
  license: GPL-2.0
  summary: Grid Analysis and Display System (GrADS)
